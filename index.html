<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STOP – Sicherheitskultur trainieren</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8ECEF;--ink:#14202B;--mute:#566573;--card:#fff;--line:#C9D1D8;--red:#C8201F;--green:#1E7A4B;--amber:#B26A00;--tint-g:#E3F2EA;--tint-r:#FBE7E6;--tint-a:#FFF1D6}
@media(prefers-color-scheme:dark){:root{--bg:#10171D;--ink:#E8EDF1;--mute:#97A5B1;--card:#18232C;--line:#2C3A46;--red:#EF5350;--green:#4CC38A;--amber:#F0B04A;--tint-g:#15302450;--tint-r:#3A1B1B;--tint-a:#3A2D12}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 Barlow,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;line-height:1.05;margin:0}
h1{font-size:clamp(44px,12vw,72px)}
h2{font-size:30px}
.stop{display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;background:var(--red);color:#fff;font:700 24px "Barlow Condensed",sans-serif;letter-spacing:.04em;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);margin-bottom:12px}
.lead{color:var(--mute);margin:12px 0 24px}
button{font:600 17px Barlow,sans-serif;cursor:pointer;border-radius:6px;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:14px 16px;text-align:left;width:100%;margin:0 0 10px}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button.primary{background:var(--red);border-color:var(--red);color:#fff;text-align:center}
button.mode b{display:block;font-size:19px}
button.mode span{font-weight:400;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-weight:500;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--red);border-radius:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
.area{font-weight:600;color:var(--red)}
.opt.best{background:var(--tint-g);border-color:var(--green)}
.opt.bad{background:var(--tint-r);border-color:var(--red)}
.opt:disabled{cursor:default;opacity:1}
.fb{margin:6px 0 0;font-weight:400;color:var(--ink);font-size:16px}
.pct{float:right;font-weight:600;color:var(--mute)}
.why{border-left:4px solid var(--ink);padding:4px 0 4px 14px;margin:16px 0}
.score{font:700 72px "Barlow Condensed",sans-serif;line-height:1}
small{color:var(--mute)}
.row{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.row .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.row .bar{height:10px;margin:8px 0 4px;overflow:hidden}
.row .bar i{background:var(--green)}
.row.low .bar i{background:var(--red)}
.sum{display:flex;gap:12px;margin:16px 0}
.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.sum b{display:block;font:700 40px "Barlow Condensed",sans-serif;line-height:1}
@media(prefers-reduced-motion:no-preference){.stop{animation:pop .5s ease-out}@keyframes pop{from{transform:scale(.6);opacity:0}}}
</style>
</head>
<body>
<main id="app"></main>

<script type="module">
/* ====== 1) FIREBASE (optional) ======
   Trage hier deine Firebase-Web-Konfiguration ein (Projekteinstellungen > Allgemein > Web-App).
   Solange apiKey leer ist, läuft die App ohne Datenbank (nur lokal). */
const FIREBASE_CONFIG = { apiKey:"", authDomain:"", projectId:"", appId:"" };

let db=null, fs=null;
if (FIREBASE_CONFIG.apiKey) {
  try {
    const V="10.12.2";
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    db = fs.getFirestore(initializeApp(FIREBASE_CONFIG));
  } catch(e){ console.error("Firebase nicht verfügbar:", e); db=null; }
}

/* ====== 2) SZENARIEN ======
   Jede Option: t=Text, s=Punkte (2 beste, 1 teilweise, 0 falsch), f=Rückmeldung.
   Passe die Texte an eure Anlage und Abläufe an. */

    {t:"Zuschauen, er macht das schon lange",s:0,f:"Erfahrung schützt nicht vor Leckagen. Wer es sieht, ist mitverantwortlich."},

    {t:"Eine Mail an alle schreiben und den Keil lassen",s:0,f:"Gut gemeint, aber der unsichere Zustand bleibt bestehen. Erst herstellen, dann informieren."}],

{a:"Büro",q:"Ein Besucher läuft ohne Begleitung und ohne Besucherausweis Richtung Produktionshalle.",

 o:[{t:"Schieber auf Arbeitshöhe schließen und den Aufbau so anpassen, dass es damit geht",s:1,f:"Richtig. Der Schieber ist Schutzscheibe und Absaugung zugleich. Offen schützt der Abzug nicht mehr zuverlässig."},
    {t:"Offen lassen, es ist ja nur ein kurzer Schritt",s:0,f:"Gerade kurze Schritte führen zu Spritzern oder Dämpfen im Gesicht."},

 o:[{t:"STOP: erst die passende PSA holen, dann beginnen",s:1,f:"Richtig. Der Weg ist kurz im Vergleich zu einer Hautverätzung oder Vergiftung."},

{a:"Produktion",q:"Der Weg über den markierten Fußgängerweg wäre 40 Meter länger. Ihr kürzt über die Fahrzeugfläche ab, wie viele andere auch.",
 o:[{t:"Auf dem markierten Weg bleiben und Kollegen freundlich darauf ansprechen",s:1,f:"Richtig. Markierungen trennen Fußgänger und Fahrzeuge. Außerhalb sehen dich Fahrer oft zu spät."},
    {t:"Abkürzen, aber gut nach Fahrzeugen schauen",s:0,f:"Aufmerksamkeit hilft, ersetzt aber keine Trennung. Fahrer sehen dich nicht überall."},

 w:"Wege und Markierungen gelten für alle, auch bei Eile."},
{a:"Alle Bereiche",q:"Ein Kollege geht mit dem Handy in der Hand die Treppe hinunter und liest dabei eine Nachricht.",
 o:[{t:"Ansprechen: Handy weg oder stehenbleiben, erst dann lesen",s:1,f:"Richtig. Wer aufs Display schaut, übersieht Stufen, Hindernisse und Fahrzeuge."},
    {t:"Nichts sagen, ist ja nur ein Handy",s:0,f:"Stürze auf Treppen gehören zu den häufigsten Unfällen."},
    {t:"Selbst auch kurz aufs Handy schauen, es muss ja schnell gehen",s:0,f:"Nachahmen verstärkt das Verhalten. Vorbild sein wirkt besser."}],

{a:"Labor",q:"Aus der Rohrpost kommt eine Probenkapsel an, aus der Flüssigkeit tropft.",
 o:[{t:"STOP: nicht ohne PSA anfassen, Bereich absperren, Vorgesetzte und Labor informieren",s:1,f:"Richtig. Inhalt und Gefahr sind unbekannt. Zuerst absichern, dann nach Vorgabe aufnehmen und entsorgen."},
    {t:"Mit Papiertuch aufwischen und Kapsel weiterreichen",s:0,f:"Ohne Wissen über den Stoff droht Hautkontakt, Dämpfe oder Verschleppung."},
    {t:"Kapsel wieder zurückschicken",s:0,f:"Das verteilt den Stoff weiter in der Anlage."}],
 w:"Unbekannter Austritt heißt: sichern, melden, nicht improvisieren."},
{a:"Alle Bereiche",q:"Du bist nach einem Streit frustriert und hast Zeitdruck. Du merkst, dass du unkonzentriert bist, sollst aber gleich eine Aufgabe mit Chemikalien erledigen.",
 o:[{t:"STOP für mich selbst: Vorgesetzte informieren, kurz durchatmen oder die Aufgabe übergeben",s:1,f:"Richtig. Nicht fit zu sein, ist ein Sicherheitsrisiko. Das zu sagen ist stark, nicht schwach."},
    {t:"Durchziehen, damit es erledigt ist",s:0,f:"Unkonzentriertheit führt zu Fehlgriffen und Unfällen."},
    {t:"Schneller arbeiten, um den Frust loszuwerden",s:0,f:"Tempo und Wut sind eine gefährliche Kombination."}],
 w:"STOP gilt auch für den eigenen Zustand."},
{a:"Labor",q:"Im Probenschrank liegt ein Probenröhrchen ohne Etikett. Der Kunde wartet auf das Ergebnis.",

    {t:"Nach Gefühl einer Probenliste zuordnen",s:0,f:"Eine Verwechslung kann Qualität und Sicherheit gefährden."},
    {t:"Analysieren und im Bericht auf die Unsicherheit hinweisen",s:0,f:"Besser als verschweigen, aber trotzdem verschwendet und riskant."}],
 w:"Ohne eindeutige Kennzeichnung gibt es keine Weiterverarbeitung."},
{a:"Labor",q:"Ein Glaskolben hat am Rand einen kleinen Absplitter. Du brauchst genau diese Größe für den Ansatz, der gleich unter Vakuum laufen soll.",
 o:[{t:"Kolben nicht verwenden, mit Schnittschutzhandschuhen in den Glasbruchbehälter geben und ein intaktes Gerät nehmen",s:1,f:"Richtig. Beschädigtes Glas kann unter Vakuum oder Hitze zerspringen und Schnittverletzungen verursachen. Bei der Entsorgung Schnittschutzhandschuhe tragen."},
    {t:"Verwenden, aber hinter dem Schieber arbeiten",s:0,f:"Der Schieber mindert Folgen, aber der Defekt bleibt. Erst vermeiden, dann schützen."},
    {t:"Mit Klebeband sichern",s:0,f:"Klebeband verhindert kein Springen und wird vom Lösemittel angegriffen."}],
 w:"Glas mit Schäden ist Ausschuss, ohne Ausnahme."},
{a:"Labor",q:"Am Abzug steht ein Becherglas mit vollständigem Etikett (Stoffname, Gefahrenpiktogramm, Datum, Kürzel). Der Frontschieber steht auf Arbeitshöhe, es gibt keinen Alarm. Du willst mit deiner Arbeit weitermachen.",
 o:[{t:"Weiterarbeiten. Es gibt hier nichts zu beanstanden",s:1,f:"Richtig. Der Inhalt ist eindeutig gekennzeichnet und der Abzug wird korrekt benutzt. Es gibt keinen unsicheren Zustand."},
    {t:"STOP sagen und die Laborleitung holen",s:0,f:"Hier war alles in Ordnung: Etikett vollständig, Schieber richtig, kein Alarm. Bei echten Zweifeln ist Nachfragen immer erlaubt, hier gab es aber keinen Grund."},
    {t:"Den Inhalt vorsichtshalber entsorgen",s:0,f:"Ein korrekt gekennzeichneter Stoff muss nicht entsorgt werden."}],
 w:"STOP heißt auch: erkennen, wann alles in Ordnung ist."},
{a:"Produktion",q:"Ein Kollege öffnet ein Ventil am Handrad, ohne Gewalt und ohne Hilfsmittel. Er trägt die vorgeschriebene PSA und der Bereich ist ordnungsgemäß abgesperrt.",
 o:[{t:"Nichts unternehmen. Die Arbeit läuft wie vorgesehen",s:1,f:"Richtig. Handrad ohne Gewalt, PSA vorhanden, Bereich abgesperrt: Das ist ein sicherer Ablauf."},
    {t:"Ihn unterbrechen und den Schichtleiter holen",s:0,f:"Es gibt keinen unsicheren Zustand. Unnötiges Unterbrechen kann selbst zu Fehlern führen."},

 o:[{t:"Wie angekündigt weiterarbeiten",s:1,f:"Richtig. Der Alarm ist angekündigt, bekannt und erfordert keine Maßnahme."},

/* ====== 3) APP ====== */
const $=document.getElementById("app");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let mode="quiz", i=0, pts=0, order=[];
const sid=Math.random().toString(36).slice(2,10);

function start(){
  i=0;pts=0;order=[...SC.keys()].sort(()=>Math.random()-.5);
  $.innerHTML=`<div class="stop" aria-hidden="true">STOP</div>
  <h1>Würdest du STOP sagen?</h1>
  <p class="lead">${SC.length} Situationen aus Produktion, Labor und Büro. Nicht in jeder Situation ist STOP nötig. Schau genau hin. Wähle, wie du üben möchtest.</p>
  <button class="mode" data-m="quiz"><b>Quiz</b><span>Mit Punkten. Die sicherste Handlung zählt am meisten.</span></button>
  <button class="mode" data-m="reflect"><b>Was würdest du tun?</b><span>Ohne Punkte. Du siehst, wie sich Kolleginnen und Kollegen entscheiden.</span></button>
  <button class="mode" id="st"><b>Teamergebnisse</b><span>Wo entscheiden wir uns sicher und wo lohnt sich ein Gespräch?</span></button>
  <p><small>Antworten werden anonym gespeichert${db?"":" (derzeit nur lokal, da keine Datenbank verbunden ist)"}.</small></p>`;
  $.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;show()});
  document.getElementById("st").onclick=stats;
}

function show(){
  const id=order[i], s=SC[id];
  $.innerHTML=`<div class="top"><span>Situation ${i+1} von ${SC.length}</span><span>${mode==="quiz"?pts+" Punkte":"Ohne Wertung"}</span></div>
  <div class="bar"><i style="width:${i/SC.length*100}%"></i></div>
  <div class="card"><div class="area">${esc(s.a)}</div><h2 style="margin-top:6px">${esc(s.q)}</h2></div>
  <div id="opts">${s.o.map((o,k)=>[o,k]).sort(()=>Math.random()-.5).map(([o,k])=>`<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("")}</div>
  <div id="res"></div>`;
  $.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(id,+b.dataset.k));
}

async function answer(id,k){
  const s=SC[id], o=s.o[k];
  if(mode==="quiz")pts+=o.s;
  document.querySelectorAll(".opt").forEach(b=>{
    const n=+b.dataset.k; b.disabled=true;
    const sc=s.o[n].s;
    b.classList.add(sc===1?"best":"bad");
    if(n===k) b.style.borderWidth="4px";
    b.insertAdjacentHTML("beforeend",`<span class="pct"></span>${n===k?`<p class="fb">${esc(s.o[n].f)}</p>`:""}`);
  });
  const best=s.o.findIndex(x=>x.s===1);
  const res=document.getElementById("res");
  res.innerHTML=`${k!==best?`<div class="card"><b>Sicherste Handlung:</b> ${esc(s.o[best].t)}<p class="fb">${esc(s.o[best].f)}</p></div>`:""}
  <div class="why"><b>Merksatz:</b> ${esc(s.w)}</div>
  <button class="primary" id="next">${i+1<SC.length?"Nächste Situation":"Ergebnis ansehen"}</button>`;
  document.getElementById("next").onclick=()=>{i++;i<SC.length?show():end()};
  // Antwort speichern, Verteilung laden
  const counts=s.o.map(()=>0);
  try{
    if(db){
      await fs.addDoc(fs.collection(db,"stop_answers"),{sid,sc:id,opt:k,pts:o.s,mode,ts:fs.serverTimestamp()});
      const snap=await fs.getDocs(fs.query(fs.collection(db,"stop_answers"),fs.where("sc","==",id)));
      snap.forEach(d=>{const v=d.data().opt; if(counts[v]!==undefined)counts[v]++});
    } else counts[k]=1;
  }catch(e){console.error(e);counts[k]=1}
  const tot=counts.reduce((a,b)=>a+b,0)||1;
  document.querySelectorAll(".pct").forEach(p=>{ const n=+p.parentElement.dataset.k; if(db||mode==="reflect") p.textContent=Math.round(counts[n]/tot*100)+" %"; });
}

function end(){
  const max=SC.length;
  const msg=pts>=max*.85?"Stark. Du erkennst unsichere Zustände sicher.":pts>=max*.6?"Solide. Einige Situationen lohnen sich noch einmal.":"Gut, dass du geübt hast. Im Zweifel gilt immer STOP.";
  $.innerHTML=`<div class="stop" aria-hidden="true">STOP</div>
  <h1>${mode==="quiz"?"Dein Ergebnis":"Geschafft"}</h1>
  ${mode==="quiz"?`<p class="score">${pts} / ${max}</p><p class="lead">${msg}</p>`:`<p class="lead">Sprecht in eurem Team darüber: Wo war die Entscheidung schwierig, und was hätte euch geholfen, STOP zu sagen?</p>`}
  <div class="why"><b>Zum Mitnehmen:</b> STOP darf jeder sagen, jederzeit, zu jedem. Niemand wird dafür kritisiert, auch nicht bei einem Fehlalarm.</div>
  <button class="primary" id="again">Nochmal üben</button>
  <button id="st2">Teamergebnisse ansehen</button>`;
  document.getElementById("again").onclick=start;
  document.getElementById("st2").onclick=stats;
}
/* Kurzbezeichnungen für die Teamergebnisse. Reihenfolge muss mit SC übereinstimmen. */
const LABELS=["Ventil mit Gewalt öffnen","Unbeschriftetes Becherglas","Brandschutztür verkeilt","Gaswarnalarm bei Abfüllung","Abzugsalarm bei laufender Reaktion","Besucher ohne Begleitung","Unsicher, ob STOP nötig ist","Probenahmepunkt ohne Etikett","Offener Frontschieber am Abzug","Falsche PSA","Außerhalb der Markierungen","Handy beim Treppensteigen","Ausgelaufene Probe in der Rohrpost","Hektik und Frust","Probe ohne Etikett","Beschädigtes Glas","Etikettiertes Becherglas am Abzug (in Ordnung)","Ventil am Handrad (in Ordnung)","Fußweg und Stapler (in Ordnung)","Handy am Flurrand (in Ordnung)","Angekündigter Probealarm (in Ordnung)"];

async function stats(){
  $.innerHTML=`<h1>Teamergebnisse</h1><p class="lead">Lade Daten …</p>`;
  const back=`<button class="primary" id="bk">Zurück zum Start</button>`;
  const fin=h=>{$.innerHTML=h+back;document.getElementById("bk").onclick=start};
  if(!db) return fin(`<h1>Teamergebnisse</h1><p class="lead">Es ist keine Datenbank verbunden. Daher gibt es keine Teamergebnisse.</p>`);
  try{
    const snap=await fs.getDocs(fs.collection(db,"stop_answers"));
    const st=LABELS.map(()=>({n:0,best:0})), ses=new Set(); let tot=0;
    snap.forEach(d=>{const v=d.data(); if(v.pts===undefined||!st[v.sc])return; st[v.sc].n++; if(v.pts===1)st[v.sc].best++; ses.add(v.sid); tot++});
    const rows=LABELS.map((l,k)=>({l,n:st[k].n,p:st[k].n?Math.round(st[k].best/st[k].n*100):null})).sort((a,b)=>(a.p??101)-(b.p??101));
    fin(`<h1>Teamergebnisse</h1>
    <p class="lead">Anteil der Antworten mit der sichersten Handlung. Rot markierte Situationen (unter 60 %) sind gute Themen für ein Teamgespräch. Die Daten sind anonym.</p>
    <div class="sum"><div><b>${ses.size}</b>Durchgänge</div><div><b>${tot}</b>Antworten</div></div>`+
    rows.map(r=>`<div class="row ${r.p!==null&&r.p<60?"low":""}"><div class="h"><span>${esc(r.l)}</span><span>${r.p===null?"–":r.p+" %"}</span></div><div class="bar"><i style="width:${r.p||0}%"></i></div><small>${r.n} Antworten</small></div>`).join(""));
  }catch(e){console.error(e);fin(`<h1>Teamergebnisse</h1><p class="lead">Die Daten konnten nicht geladen werden. Bitte versuche es später noch einmal.</p>`)}
}
start();
</script>
